[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interval-data-vee"
version = "0.1.0"
description = "Validation, estimation and editing (VEE) for 15-minute smart-meter interval data, with an audit trail and a plain export with quality flags."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VB-Builds" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
interval-vee = "interval_vee.cli:main"

[tool.setuptools.packages.find]
include = ["interval_vee*"]

[tool.setuptools.package-data]
interval_vee = ["data/*.csv.gz", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
